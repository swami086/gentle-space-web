apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmemory-api
  namespace: openmemory
  labels:
    app: openmemory-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: openmemory-api
  template:
    metadata:
      labels:
        app: openmemory-api
    spec:
      serviceAccountName: openmemory-sa
      containers:
        - name: api
          image: skpassegna/openmemory-mcp:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 -c "
              from pathlib import Path
              p = Path('/usr/src/openmemory/app/database.py')
              t = p.read_text()
              old = 'engine = create_engine(\n    DATABASE_URL,\n    connect_args={\"check_same_thread\": False}  # Needed for SQLite\n)'
              new = 'connect_args = ({\"check_same_thread\": False} if DATABASE_URL.startswith(\"sqlite\") else {})\nengine = create_engine(DATABASE_URL, connect_args=connect_args)'
              p.write_text(t.replace(old, new) if old in t else t)
              "
              cd /usr/src/openmemory && exec uvicorn main:app --host 0.0.0.0 --port 8765
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openmemory-secrets
                  key: OPENAI_API_KEY
            - name: USER
              valueFrom:
                configMapKeyRef:
                  name: openmemory-config
                  key: USER
            - name: QDRANT_HOST
              valueFrom:
                configMapKeyRef:
                  name: openmemory-config
                  key: QDRANT_HOST
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openmemory-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: openmemory-api
  namespace: openmemory
spec:
  type: LoadBalancer
  selector:
    app: openmemory-api
  ports:
    - name: http
      port: 8765
      targetPort: 8765
