services:
  db:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    image: gentle-space-pg:pg16-age
    container_name: gentle-space-pg
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: gentle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gentle}
      POSTGRES_DB: gentle_space_listings
    volumes:
      - gentle_space_pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      # BuildKit's docker-container driver only allows "default"/"none"/"host"
      # networks for RUN steps (not arbitrary bridge names). With this builder
      # attached to gentle_space_net (see buildx builder setup), "host" mode
      # resolves to *its own* netns, which is that same bridge network — so
      # `db` is reachable by its compose service name during `next build` SSG.
      network: host
      args:
        DATABASE_URL: postgresql://gentle:gentle@db:5432/gentle_space_listings
        NEXT_PUBLIC_GOOGLE_MAPS_JS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_JS_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://gentlespacesolutions.com}
    image: gentle-space-web:latest
    container_name: gentle-space-web
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.production
    volumes:
      - ../.secrets:/app/.secrets:ro
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: gentle-space-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  gentle_space_pgdata:
  caddy_data:
  caddy_config:

networks:
  default:
    name: gentle_space_net
