services:
  caddy:
    networks:
      - default
      - twenty_default
    depends_on:
      - web
      - auth
      - ads-agent

  auth:
    build: ../auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - default
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgres://auth_service:${AUTH_DB_PASSWORD}@auth-db:5432/auth_service}
      AUTH_URL: https://auth.gentlespacesolutions.com
      ADS_APP_URL: https://ads.gentlespacesolutions.com/
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_JWT_PRIVATE_KEY_PEM: ${AUTH_JWT_PRIVATE_KEY_PEM}
      AUTH_JWT_PUBLIC_KEY_PEM: ${AUTH_JWT_PUBLIC_KEY_PEM}
      AUTH_JWT_KID: auth-service-key-1
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      COOKIE_DOMAIN: .gentlespacesolutions.com
    expose:
      - "3040"
    restart: unless-stopped

  auth-db:
    image: postgres:16
    networks:
      - default
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U auth_service -h localhost -d auth_service
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ads-agent:
    build: ../ads-agent
    depends_on:
      ads-db:
        condition: service_healthy
      bifrost:
        condition: service_started
      google-ads-mcp:
        condition: service_started
    networks:
      - default
    environment:
      DATABASE_URL: ${ADS_AGENT_DATABASE_URL:-postgres://ads_agent:${ADS_DB_PASSWORD}@ads-db:5432/ads_agent}
      AUTH_SERVICE_URL: https://auth.gentlespacesolutions.com
      AUTH_SERVICE_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ADS_APP_URL: https://ads.gentlespacesolutions.com/
      # Meta / Google Ads / Twenty / Bifrost — supply via deploy/.env.production (see ads-agent/.env.example)
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_ADS_MCP_URL: http://google-ads-mcp:8766/mcp
      TWENTY_BASE_URL: ${TWENTY_BASE_URL:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      # Hardcoded compose DNS — do not use localhost from local .env.local copies
      BIFROST_BASE_URL: http://bifrost:8080
      BIFROST_CHAT_MODEL: ${BIFROST_CHAT_MODEL:-vertex/gemini-2.5-flash-lite}
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-propane-galaxy-498403-n8}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 */6 * * *}
    expose:
      - "3030"
    restart: unless-stopped

  # Internal-only Vertex gateway (not in Caddy). Campaign chat + rationale call this.
  bifrost:
    image: maximhq/bifrost:latest
    networks:
      - default
    environment:
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-propane-galaxy-498403-n8}
      # Must be raw SA JSON (one line), not base64 — see ads-agent/bifrost/README.md
      VERTEX_AUTH_CREDENTIALS: ${VERTEX_AUTH_CREDENTIALS}
      GOGC: "100"
      GOMEMLIMIT: "450MiB"
    volumes:
      - bifrost-data:/app/data
      - ../ads-agent/bifrost/config.json:/app/data/config.json:ro
    expose:
      - "8080"
    mem_limit: 512m
    cpus: "1.0"
    restart: unless-stopped

  google-ads-mcp:
    build: ../ads-agent
    command: ["npx", "tsx", "scripts/run-google-ads-mcp.ts"]
    depends_on:
      ads-db:
        condition: service_healthy
    networks:
      - default
    environment:
      DATABASE_URL: ${ADS_AGENT_DATABASE_URL:-postgres://ads_agent:${ADS_DB_PASSWORD}@ads-db:5432/ads_agent}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_ADS_MCP_ALLOWED_HOSTS: google-ads-mcp,localhost,127.0.0.1
      # localhost bind inside a container is unreachable via Compose DNS / expose
      GOOGLE_ADS_MCP_BIND: "0.0.0.0"
    expose:
      - "8766"
    restart: unless-stopped

  ads-db:
    image: postgres:16
    networks:
      - default
    environment:
      POSTGRES_DB: ads_agent
      POSTGRES_USER: ads_agent
      POSTGRES_PASSWORD: ${ADS_DB_PASSWORD}
    volumes:
      - ads-db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ads_agent -h localhost -d ads_agent
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  twenty_default:
    external: true

volumes:
  auth-db-data:
  ads-db-data:
  bifrost-data:
