services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    image: gentle-space-pg:pg18-age
    container_name: gentle-space-pg
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: gentle
      POSTGRES_PASSWORD: gentle
      POSTGRES_DB: gentle_space_listings
    volumes:
      # PG18+ stores data under /var/lib/postgresql/<major>/docker (not .../data).
      - gentle_space_pgdata:/var/lib/postgresql

volumes:
  gentle_space_pgdata:
